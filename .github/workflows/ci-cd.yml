name: MAMS Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Backend Continuous Integration & Quality Gate
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Node.js & Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Generate Prisma ORM Client
        run: npx prisma generate

      - name: TypeScript Strict Type Check
        run: npx tsc --noEmit

      - name: Verify Backend Production Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Stage 2: Frontend Continuous Integration & Bundle Verification
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (React 18 & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify Vite Production Build
        run: npm run build

      - name: Validate Production Build Artifacts
        run: |
          test -f dist/index.html || exit 1
          echo "Frontend client bundle compiled successfully."

  # ---------------------------------------------------------------------------
  # Stage 3: Automated Health & Deployment Smoke Test
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Production Health Probe & Smoke Test
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Ping Live Railway Backend Health Endpoint
        run: |
          echo "Pinging production backend health endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://militaryasset-production.up.railway.app/health)
          echo "Backend Health HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "Production Backend is healthy and operational."
          else
            echo "Production Backend returned non-200 status: $STATUS"
            # Allow non-fatal on pull requests if Railway is redeploying
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "Warning: Backend returned status $STATUS during deployment cycle."
            fi
          fi

      - name: Ping Live Vercel Frontend Edge Endpoint
        run: |
          echo "Pinging production frontend edge deployment..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L https://militaryasset-three.vercel.app)
          echo "Frontend Edge HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "Production Frontend is live and responding."
          fi
